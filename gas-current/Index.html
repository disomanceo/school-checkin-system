<!DOCTYPE html>
<html>

<head>

  <base target="_top">

  <script src="https://cdn.tailwindcss.com"></script>

  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <style>

    :root {

      --school-red-dark: #3b1768;
      --school-red: #7c3aed;
      --school-red-soft: #a78bfa;
      --school-gold: #facc15;
      --school-gold-deep: #b45309;
      --school-cream: #f5edff;
      --school-purple-soft: #ede9fe;
      --school-purple-deep: #4c1d95;
    }

    body {

      background:
        radial-gradient(circle at 12% 12%, rgba(250,204,21,0.18), transparent 28%),
        radial-gradient(circle at 88% 20%, rgba(167,139,250,0.34), transparent 30%),
        linear-gradient(135deg, #f4eaff 0%, #c4b5fd 42%, #7c3aed 100%);

      min-height: 100vh;

      font-family: sans-serif;

      color: white;
    }

    body::before {

      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      opacity: 0.18;

      background:
        linear-gradient(105deg, transparent 0 43%, rgba(76,29,149,0.35) 44% 45%, transparent 46% 100%),
        linear-gradient(78deg, transparent 0 61%, rgba(132,204,22,0.28) 62% 63%, transparent 64% 100%);

      background-size: 180px 240px, 220px 260px;
      mix-blend-mode: multiply;
    }

    .glass {

      background:
        linear-gradient(
          145deg,
          rgba(255,255,255,0.42),
          rgba(255,255,255,0.18)
        );

      backdrop-filter: blur(12px);

      border:
        1px solid rgba(255,255,255,0.42);

      box-shadow:
        0 24px 70px rgba(67,24,103,0.28),
        inset 0 1px 0 rgba(255,255,255,0.42);
    }

    .login-card {

      position: relative;
      overflow: visible;

      border:
        1px solid rgba(255,255,255,0.5);
    }

    .login-card > *:not(.login-panda) {

      position: relative;
      z-index: 2;
    }

    .login-panda {

      position: absolute;
      top: -112px;
      right: -34px;
      width: 150px;
      height: auto;
      z-index: 1;
      pointer-events: none;

      filter:
        drop-shadow(0 16px 18px rgba(49,18,80,0.28));
    }

    .login-title-gradient {

      color: transparent;

      background:
        linear-gradient(
          90deg,
          #ffffff,
          var(--school-gold),
          #7c3aed,
          #ffffff
        );

      background-size: 220% 100%;

      -webkit-background-clip: text;
      background-clip: text;

      text-shadow:
        0 0 24px rgba(124,58,237,0.2);

      animation:
        titleGoldFlow 7s ease-in-out infinite;
    }

    .logo-glow {

      filter:
        drop-shadow(0 0 10px rgba(250,204,21,0.28))
        drop-shadow(0 8px 18px rgba(70,8,8,0.24));

      animation:
        logoSoftGlow 4s ease-in-out infinite;
    }

    .checkin-clock {

      display: inline-flex;
      align-items: baseline;
      justify-content: center;
      gap: 6px;

      margin: 0 auto 18px;
      padding: 8px 16px;

      border-radius: 999px;
      background:
        rgba(255,255,255,0.3);

      border:
        1px solid rgba(255,255,255,0.42);

      color: #ffffff;
      box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.36),
        0 10px 22px rgba(67,24,103,0.16);
    }

    .checkin-clock-time {

      font-size: 28px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: 0;
      color: #ffffff;
      text-shadow:
        0 2px 10px rgba(76,29,149,0.26);
    }

    .checkin-clock-unit {

      font-size: 14px;
      font-weight: 700;
      color: rgba(255,255,255,0.86);
    }

    .btn-main {

      background:
        linear-gradient(
          135deg,
          #fff4a3,
          var(--school-gold),
          var(--school-gold-deep)
        );

      color: #6f1010;

      position: relative;

      overflow: hidden;

      transition: 0.2s;

      box-shadow:
        0 14px 30px rgba(74,10,10,0.35),
        0 0 22px rgba(250,204,21,0.22);
    }

    .btn-main::before {

      content: "";

      position: absolute;
      top: -35%;
      left: -80%;

      width: 48%;
      height: 170%;

      background:
        linear-gradient(
          90deg,
          transparent,
          rgba(255,255,255,0.52),
          transparent
        );

      transform: rotate(18deg);

      animation:
        buttonShimmer 3.8s ease-in-out infinite;
    }

    .btn-main > span {

      position: relative;
      z-index: 1;
    }

    .btn-main:active {

      transform: scale(0.95);
    }

    .checkin-primary {

      box-shadow:
        0 18px 40px rgba(74,10,10,0.42),
        0 0 0 8px rgba(250,204,21,0.1),
        0 0 34px rgba(250,204,21,0.34);

      animation:
        checkinGoldPulse 2.8s ease-in-out infinite;
    }

    .status-card {

      border-radius: 22px;

      padding: 18px;

      background:
        rgba(255,255,255,0.08);

      border:
        1px solid rgba(255,244,190,0.16);
    }

    @keyframes titleGoldFlow {

      0% {
        background-position: 0% 50%;
      }

      50% {
        background-position: 100% 50%;
      }

      100% {
        background-position: 0% 50%;
      }
    }

    @keyframes logoSoftGlow {

      0%,
      100% {
        filter:
          drop-shadow(0 0 10px rgba(250,204,21,0.28))
          drop-shadow(0 10px 24px rgba(70,8,8,0.28));
      }

      50% {
        filter:
          drop-shadow(0 0 18px rgba(250,204,21,0.48))
          drop-shadow(0 12px 30px rgba(70,8,8,0.36));
      }
    }

    @keyframes buttonShimmer {

      0% {
        left: -85%;
      }

      42%,
      100% {
        left: 135%;
      }
    }

    @keyframes checkinGoldPulse {

      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-2px);
      }
    }

    @media (prefers-reduced-motion: reduce) {

      .login-title-gradient,
      .logo-glow,
      .btn-main::before,
      .checkin-primary {
        animation: none;
      }
    }

    @media (max-width: 520px) {

      .login-panda {

        top: -84px;
        right: -10px;
        width: 112px;
      }
    }

    .floating-menu-button {

      background:
        linear-gradient(
          135deg,
          #fff4a3,
          var(--school-gold),
          var(--school-gold-deep)
        );

      color: var(--school-red-dark);

      border:
        2px solid rgba(255,255,255,0.55);

      box-shadow:
        0 14px 32px rgba(74,10,10,0.38),
        0 0 18px rgba(250,204,21,0.3);
    }

    .floating-menu-panel {

      background:
        rgba(255,255,255,0.96);

      color: #7f1d1d;
    }

  </style>

</head>

      <h1
        id="login-title"
        class="text-4xl font-bold
        text-yellow-300 text-center mb-3
        login-title-gradient">

        ระบบลงเวลา

      </h1>

      <div
        id="school-brand"
        class="text-center mb-8 hidden">

        <img
          id="school-logo"
          src=""
          alt="โลโก้โรงเรียน"
          class="object-contain mx-auto mb-3 hidden logo-glow"
          style="max-width: 180px; height: auto;">

        <div
          id="school-name"
          class="text-white text-xl font-bold">
        </div>

      </div>

      <input
        id="phone"
        type="tel"
        placeholder="เบอร์โทรศัพท์"
        class="w-full p-4 rounded-2xl
        bg-white/20 text-white
        placeholder-white/70 outline-none mb-5">

      <input
        id="pin"
        type="password"
        inputmode="numeric"
        maxlength="4"
        placeholder="PIN 4 หลัก"
        class="w-full p-4 rounded-2xl
        bg-white/20 text-white
        placeholder-white/70 outline-none mb-3">

      <label
        class="flex items-start gap-3 text-white/90 text-sm mb-5 select-none">
        <input
          id="remember-login"
          type="checkbox"
          class="mt-1 h-4 w-4 rounded border-white/40 bg-white/20">
        <span>
          จำเบอร์โทรและ PIN บนเครื่องนี้
          <span class="block text-xs text-white/65 mt-0.5">
            เหมาะสำหรับเครื่องส่วนตัวเท่านั้น
          </span>
        </span>
      </label>

      <button
        onclick="login()"
        class="btn-main w-full
        py-4 rounded-2xl
        text-xl font-bold">

        <span>Login</span>

      </button>

      <div
        class="text-center mt-5">

        <button
          onclick="showRegister()"
          class="text-yellow-200 text-sm">

          ยังไม่มีบัญชี? สมัครสมาชิก

        </button>

      </div>

    </div>

    <!-- REGISTER -->

    <div
      id="register-section"
      class="glass rounded-3xl p-8
      shadow-2xl hidden">

      <h2
        class="text-3xl font-bold
        text-yellow-300 text-center mb-8">

        สมัครสมาชิก

      </h2>

      <input
        id="reg-name"
        type="text"
        placeholder="ชื่อ - นามสกุล"
        class="w-full p-4 rounded-2xl
        bg-white/20 text-white
        placeholder-white/70 outline-none mb-5">

      <input
        id="reg-phone"
        type="tel"
        placeholder="เบอร์โทรศัพท์"
        class="w-full p-4 rounded-2xl
        bg-white/20 text-white
        placeholder-white/70 outline-none mb-5">

      <input
        id="reg-pin"
        type="password"
        inputmode="numeric"
        maxlength="4"
        placeholder="ตั้ง PIN 4 หลัก"
        class="w-full p-4 rounded-2xl
        bg-white/20 text-white
        placeholder-white/70 outline-none mb-5">

      <input
        id="reg-pin-confirm"
        type="password"
        inputmode="numeric"
        maxlength="4"
        placeholder="ยืนยัน PIN 4 หลัก"
        class="w-full p-4 rounded-2xl
        bg-white/20 text-white
        placeholder-white/70 outline-none mb-5">

      <input id="reg-position" type="hidden">

      <div class="mb-5">
        <div class="text-white/90 text-sm font-semibold mb-2">
          เลือกตำแหน่ง
        </div>

        <div class="grid grid-cols-2 gap-2">
          <button
            type="button"
            data-position-option="ครู"
            onclick="selectRegisterPosition('ครู')"
            class="reg-position-btn rounded-2xl p-3
            bg-white/20 text-white font-semibold
            border border-white/25">
            ครู
          </button>

          <button
            type="button"
            data-position-option="ภารโรง"
            onclick="selectRegisterPosition('ภารโรง')"
            class="reg-position-btn rounded-2xl p-3
            bg-white/20 text-white font-semibold
            border border-white/25">
            ภารโรง
          </button>

          <button
            type="button"
            data-position-option="เจ้าหน้าที่"
            onclick="selectRegisterPosition('เจ้าหน้าที่')"
            class="reg-position-btn rounded-2xl p-3
            bg-white/20 text-white font-semibold
            border border-white/25">
            เจ้าหน้าที่
          </button>

          <button
            type="button"
            data-position-option="ผู้บริหาร"
            onclick="selectRegisterPosition('ผู้บริหาร')"
            class="reg-position-btn rounded-2xl p-3
            bg-white/20 text-white font-semibold
            border border-white/25">
            ผู้บริหาร
          </button>
        </div>
      </div>

      <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-5 text-left">
        <label class="block text-white/90 text-sm font-semibold">
          รูปประจำตัว (ไม่บังคับ)
          <input
